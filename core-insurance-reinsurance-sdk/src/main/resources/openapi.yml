components:
  schemas:
    TreatyDTO:
      required:
      - effectiveFrom
      - lineOfBusiness
      - reinsurerPartyId
      - tenantId
      - treatyNumber
      - treatyStatus
      - treatyType
      type: object
      properties:
        treatyId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        treatyNumber:
          maxLength: 64
          minLength: 0
          type: string
        contractId:
          type: string
          format: uuid
        reinsurerPartyId:
          type: string
          format: uuid
        treatyType:
          type: string
          enum:
          - QUOTA_SHARE
          - SURPLUS
          - EXCESS_OF_LOSS
          - FACULTATIVE
        lineOfBusiness:
          type: string
          enum:
          - MOTOR
          - PROPERTY
          - LIABILITY
          - LIFE
          - HEALTH
          - MARINE
          - AVIATION
          - ACCIDENT
          - OTHER
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        treatyStatus:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - RUN_OFF
          - EXPIRED
        cessionRate:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReinsuranceRecoveryDTO:
      required:
      - claimId
      - notifiedAt
      - recoveryAmount
      - recoveryStatus
      - treatyId
      type: object
      properties:
        reinsuranceRecoveryId:
          type: string
          format: uuid
          readOnly: true
        treatyId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        recoveryAmount:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        recoveryStatus:
          type: string
          enum:
          - NOTIFIED
          - AGREED
          - COLLECTED
          - DISPUTED
        notifiedAt:
          type: string
          format: date-time
        paymentOrderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CessionDTO:
      required:
      - cededAt
      - cededPremium
      - cessionStatus
      - policyId
      - treatyId
      type: object
      properties:
        cessionId:
          type: string
          format: uuid
          readOnly: true
        treatyId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        premiumScheduleId:
          type: string
          format: uuid
        cededPremium:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        cessionStatus:
          type: string
          enum:
          - RECORDED
          - BORDEREAU
          - SETTLED
        cededAt:
          type: string
          format: date-time
        paymentOrderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FilterOptions:
      type: object
      properties:
        caseInsensitiveStrings:
          type: boolean
        includeInheritedFields:
          type: boolean
      description: Filter options for customizing filter behavior
    FilterRequestReinsuranceRecoveryDTO:
      required:
      - pagination
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/ReinsuranceRecoveryDTO"
        rangeFilters:
          $ref: "#/components/schemas/RangeFilter"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        options:
          $ref: "#/components/schemas/FilterOptions"
      description: Filter criteria
    PaginationRequest:
      type: object
      properties:
        pageNumber:
          type: integer
          description: The zero-based page number to retrieve.
          format: int32
          example: 0
          default: 0
        pageSize:
          type: integer
          description: The number of items per page.
          format: int32
          example: 10
          default: 10
        sortBy:
          type: string
          description: The field to sort the results by.
          example: name
        sortDirection:
          type: string
          description: "The direction of sorting, either ASC or DESC."
          example: DESC
          default: DESC
      description: "Represents a pagination request for retrieving paginated results,\
        \ including page number, size, sort field, and direction."
    RangeFilter:
      type: object
      properties:
        ranges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RangeObject"
          description: Map of field names to their range criteria
      description: Represents range filters for numeric fields
    RangeObject:
      type: object
      properties:
        from:
          type: object
          description: Start value of the range
        to:
          type: object
          description: End value of the range
      description: Represents a range with from and to values
    PaginationResponseReinsuranceRecoveryDTO:
      type: object
      properties:
        content:
          type: array
          description: The list of items for the current page.
          items:
            $ref: "#/components/schemas/ReinsuranceRecoveryDTO"
        totalElements:
          type: integer
          description: The total number of elements across all pages.
          format: int64
        totalPages:
          type: integer
          description: The total number of pages based on the data size and page size.
          format: int32
        currentPage:
          type: integer
          description: "The current page number, typically zero-based."
          format: int32
      description: Represents a paginated response containing a list of items and
        pagination metadata.
    FilterRequestCessionDTO:
      required:
      - pagination
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/CessionDTO"
        rangeFilters:
          $ref: "#/components/schemas/RangeFilter"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        options:
          $ref: "#/components/schemas/FilterOptions"
      description: Filter criteria
    PaginationResponseCessionDTO:
      type: object
      properties:
        content:
          type: array
          description: The list of items for the current page.
          items:
            $ref: "#/components/schemas/CessionDTO"
        totalElements:
          type: integer
          description: The total number of elements across all pages.
          format: int64
        totalPages:
          type: integer
          description: The total number of pages based on the data size and page size.
          format: int32
        currentPage:
          type: integer
          description: "The current page number, typically zero-based."
          format: int32
      description: Represents a paginated response containing a list of items and
        pagination metadata.
    FilterRequestTreatyDTO:
      required:
      - pagination
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/TreatyDTO"
        rangeFilters:
          $ref: "#/components/schemas/RangeFilter"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        options:
          $ref: "#/components/schemas/FilterOptions"
      description: Filter criteria
    PaginationResponseTreatyDTO:
      type: object
      properties:
        content:
          type: array
          description: The list of items for the current page.
          items:
            $ref: "#/components/schemas/TreatyDTO"
        totalElements:
          type: integer
          description: The total number of elements across all pages.
          format: int64
        totalPages:
          type: integer
          description: The total number of pages based on the data size and page size.
          format: int32
        currentPage:
          type: integer
          description: "The current page number, typically zero-based."
          format: int32
      description: Represents a paginated response containing a list of items and
        pagination metadata.
