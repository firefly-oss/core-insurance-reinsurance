        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterRequestReinsuranceRecoveryDTO"
        required: true
      responses:
        "200":
          description: Page of matching records
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginationResponseReinsuranceRecoveryDTO"
        "400":
          description: Invalid filter request
  /api/v1/treaties/{treatyId}/cessions:
    post:
      tags:
