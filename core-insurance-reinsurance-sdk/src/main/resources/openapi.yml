openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Cessions
  description: Premium ceded from a policy to a treaty
- name: Treaties
  description: Reinsurance treaty or facultative placement recorded by the insurer
- name: Reinsurance Recoveries
  description: Claim amount notified to a treaty for recovery
paths:
  /api/v1/treaties/{treatyId}:
    get:
      tags:
      - Treaties
      summary: Get Treaty by id
      description: Retrieve one Treaty
      operationId: getTreatyById
      parameters:
      - name: treatyId
        in: path
        description: Unique identifier of the Treaty
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Treaty found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatyDTO"
        "404":
          description: Treaty not found
    put:
      tags:
      - Treaties
      summary: Update Treaty
      description: Update an existing Treaty
      operationId: updateTreaty
      parameters:
      - name: treatyId
        in: path
        description: Unique identifier of the Treaty
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreatyDTO"
        required: true
      responses:
        "200":
          description: Treaty updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TreatyDTO"
        "400":
          description: Invalid data
        "404":
          description: Treaty not found
    delete:
      tags:
      - Treaties
      summary: Delete Treaty
      description: Delete a Treaty
      operationId: deleteTreaty
      parameters:
      - name: treatyId
        in: path
        description: Unique identifier of the Treaty
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "204":
          description: Treaty deleted
        "404":
          description: Treaty not found
  /api/v1/treaties/{treatyId}/recoveries/{reinsuranceRecoveryId}:
